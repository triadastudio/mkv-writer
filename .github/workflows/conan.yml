name: Conan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  create:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build_type: Release
          - os: windows-2022
            build_type: Debug
          - os: ubuntu-24.04
            build_type: Release
          - os: macos-14
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Conan
        run: python -m pip install "conan>=2.14,<3"
      - name: Detect profile
        run: conan profile detect --force
      - name: Create package
        run: conan create . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=17 --build=missing
