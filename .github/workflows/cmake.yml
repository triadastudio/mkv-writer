name: CMake

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
        shared: ["OFF", "ON"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DMKV_WRITER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        if: matrix.shared == 'OFF'
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"
      - name: Configure installed-package consumer
        if: matrix.shared == 'OFF'
        run: cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Build installed-package consumer
        if: matrix.shared == 'OFF'
        run: cmake --build build-consumer --config Release
      - name: Test installed-package consumer
        if: matrix.shared == 'OFF'
        run: ctest --test-dir build-consumer -C Release --output-on-failure
