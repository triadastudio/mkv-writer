name: Publish Conan package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'triadastudio/mkv-writer'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Conan
        run: python -m pip install "conan>=2.14,<3"
      - name: Detect profile
        run: conan profile detect --force
      - name: Create package
        run: conan create . -s build_type=Release -s compiler.cppstd=17 --build=missing
      - name: Configure remote
        run: conan remote add triada "${{ vars.CONAN_REMOTE_URL }}" --force
      - name: Authenticate
        env:
          CONAN_LOGIN_USERNAME_TRIADA: ${{ secrets.CONAN_LOGIN_USERNAME_TRIADA }}
          CONAN_PASSWORD_TRIADA: ${{ secrets.CONAN_PASSWORD_TRIADA }}
        run: conan remote auth triada --force
      - name: Upload package
        run: conan upload "mkv-writer/*" --remote=triada --check --confirm
